- type: entity
  id: CratePirateChestCaptain
  name: captains pirate chest
  suffix: Filled
  parent: CratePirate
  components:
  - type: StorageFill
    contents:
      - id: ClothingNeckCloakPirateCap
      - id: EnergyCutlass
      - id: MicroBombImplanter

- type: entity
  id: CratePirateChest
  name: crews pirate chest
  suffix: Filled
  parent: CratePirate
  components:
  - type: StorageFill
    contents:
      - id: WeaponLauncherPirateCannon
        amount: 2
      - id: ClothingOuterCoatGentle
      - id: Cutlass
        amount: 2
      - id: CannonBall
        amount: 2
      - id: WeaponPistolFlintlock
        amount: 4
      - id: WeaponShotgunBlunderbuss
        amount: 2

- type: entityTable
  id: PirateWeaponsTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: Cutlass
      - id: WeaponPistolFlintlock
      - id: WeaponShotgunBlunderbuss
      - id: WeaponLauncherPirateCannon
      - id: BrokenBottle

- type: entityTable
  id: PirateTreasureTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: GoldRing
      - id: GoldRingDiamond
      - id: SilverRingDiamond
      - id: TreasureCoinGold
      - id: TreasureCoinSilver
      - id: TreasureCoinDiamond
      - id: TreasureCoinIron
      - id: TreasureCoinAdamantine
  
- type: entityTable
  id: PirateClothingTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: ClothingUniformJumpsuitPirate
      - id: ClothingHeadBandRed
      - id: ClothingEyesEyepatch
      - id: ClothingHeadHatPirate
      - id: ClothingHeadHatPirateTricord
      - id: ClothingOuterCoatPirate
      - id: ClothingNeckCloakPirateCap
  
- type: entityTable
  id: PirateAmmoTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: CannonBall
      - id: CannonBallGrapeshot
      - id: CannonBallGlassshot

- type: entityTable
  id: PirateChestLoot
  table: !type:AllSelector
    children:
    # Weapons
    - !type:NestedSelector
      tableId: PirateWeaponsTable
      prob: 0.75
    # Treasure
    - !type:NestedSelector
      tableId: PirateTreasureTable
      rolls: !type:RangeNumberSelector
        range: 4, 7
    # Clothing
    - !type:NestedSelector
      tableId: PirateClothingTable
      prob: 0.8
      rolls: !type:RangeNumberSelector
        range: 1, 3
    # Ammo
    - !type:NestedSelector
      tableId: PirateAmmoTable
      prob: 0.6
      rolls: !type:RangeNumberSelector
        range: 1, 3

- type: entity
  id: CratePirateChestFilledRandom
  suffix: Filled, Random
  parent: CratePirate
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: PirateChestLoot